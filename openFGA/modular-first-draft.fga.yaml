name: modular-model
model: |
  model
    schema 1.1

  type user

  type project
    relations
      # Project hierarchy - projects can have parent projects
      # This allows creating nested project structures (e.g., organization -> department -> team)
      # Child projects can inherit permissions from parent projects
      # Example: project:engineering_department -> parent -> project:company
      define parent: [project]
      
      # Direct user assignments (for owners and admins)
      # Owner has full control over the project and all child projects
      # Owner permissions are inherited by child projects through the parent relation
      define owner: [user] or owner from parent
      
      # Admin users - can manage the project but don't have delete rights
      # Admins can be assigned directly or inherit from parent projects
      define admin: [user] or owner or admin from parent
      
      # Access objects assigned to this project
      # Each project defines which access objects are available
      # Note: This is a direct relation (no inheritance) to allow use in tuplesets
      # Access inheritance is handled through the member relation below
      # Example: project:project1 -> has_access -> access:write_access
      define has_access: [access]
      
      # Direct relation for roles (populated from access objects)
      # IMPORTANT: When an access object is assigned to a project via has_access,
      # you must also assign all roles from that access to the project via project_role
      # This is required because OpenFGA cannot traverse: project -> has_access -> access -> has_role -> role
      # The chain for membership: project -> project_role -> role -> assignee -> user
      # Example: If access:write_access has role:developer, and project:project1 has access:write_access,
      # then you must also create: project:project1 -> project_role -> role:developer
      define project_role: [role]
      
      # Computed relations for checking access
      # A user is a member if they are assigned to a role that modifies permissions on an access assigned to this project
      # The logical chain: project -> has_access -> access -> has_role -> role -> assignee -> user
      # The implementation chain: project -> project_role -> role -> assignee -> user
      # Membership can also be inherited from parent projects (through admin/owner or through parent's access)
      # Note: Direct user assignment is also supported for flexibility
      define member: [user] or assignee from project_role or member from parent
      
      # Permission checks
      # View permission: members, admins, or inherited from parent
      define can_view: member or admin or can_view from parent
      # Edit permission: admins or inherited from parent
      # Note: Users cannot be directly granted edit permission - only admins can edit
      define can_edit: admin or can_edit from parent
      # Delete permission: only owners (inherited from parent)
      define can_delete: owner or can_delete from parent
      
      # User management permission - allows managing users on the project
      # Base relation: can_manage_users_user allows explicitly granting this permission to specific users
      # This is useful when you want to grant user management rights without making someone a full admin
      # Example: Grant user:bob the ability to manage users on project:project1
      #   - object: project:project1
      #     user: user:bob
      #     relation: can_manage_users_user
      define can_manage_users_user: [user]
      
      # Computed relation: checks if a user can manage users on this project
      # Checks three conditions (in order):
      #   1. admin - admins automatically have user management rights
      #   2. can_manage_users_user - users explicitly granted this permission
      #   3. can_manage_users from parent - inherits permission from parent project in hierarchy
      # This allows flexible user management: admins always can, specific users can be granted,
      # and permissions flow down through the project hierarchy
      define can_manage_users: admin or can_manage_users_user or can_manage_users from parent

  type role
    relations
      # Users assigned to this role
      # The condition not_expired_grants ensures that only non-expired grants are valid
      # When assigning a user to a role, you can include expiration_time in the context
      # Example: assignee relation with expiration_time in the tuple context
      define assignee: [user with not_expired_grants, user]
      
      # Permissions this role modifies on access objects
      # When a role is assigned to an access object, it can modify specific permissions on that access
      # Example: role:developer -> modifies_permission -> permission:write
      # This means users with role:developer can perform permission:write on access objects where this role is assigned
      # Permissions can be inherited from parent roles
      define modifies_permission: [permission] or modifies_permission from parent
      
      # Role hierarchy (for role inheritance)
      # e.g., "admin" role can inherit from "member" role
      define parent: [role]
      
      # Delegation permission - allows users with this role to delegate permissions to others
      # Can be set directly on roles (by assigning the role to itself)
      # Note: Cannot inherit from parent because it's used in tuplesets (assignee from can_delegate)
      # Example: role:manager has can_delegate, so users with manager role can delegate access
      define can_delegate: [role]
      
      # Computed: users with this role
      define members: assignee
      
      # Specific permission flags for roles
      # These can be set directly on roles (by assigning the role to itself) or inherited from parent roles
      define can_edit: [role] or can_edit from parent
      define can_manage_users: [role] or can_manage_users from parent
      
      # Users who can edit/manage through this role (computed based on role permissions)
      define users_who_can_edit: assignee
      define users_who_can_manage_users: assignee
      
      # Users who can delegate through this role (only if role has can_delegate permission)
      # This allows checking: "Can user:dave delegate?" (yes, if they're assigned to role:manager which has can_delegate)
      define users_who_can_delegate: assignee from can_delegate

  type access
    # Access objects define permission scopes that are assigned to projects
    # Each access object can have roles assigned to it, and those roles modify permissions on the access
    # Example: project:project1 -> has_access -> access:write_access -> has_role -> role:developer
    # The role:developer then modifies permissions (e.g., permission:write) on access:write_access
    # 
    # Structure: project -> access -> role -> permission
    # This allows fine-grained control: each project defines its access objects,
    # each access object has roles that modify specific permissions
    relations
      # Roles assigned to this access object
      # These roles modify permissions on this access
      # Example: access:write_access -> has_role -> role:developer
      # This means role:developer can modify permissions on access:write_access
      define has_role: [role]
      
      # Helper relation: users assigned to roles on this access
      # This allows projects to easily check membership through access objects
      # Chain: access -> has_role -> role -> assignee -> user
      define users: assignee from has_role
      
      # What permissions this access object defines
      # An access object defines one or more specific permissions
      # Example: access:write_access -> defines_permission -> permission:write
      # This creates the base set of permissions that roles can modify
      define defines_permission: [permission]
      

  type permission
    # Permissions are leaf nodes representing specific actions or capabilities
    # They are the atomic units of authorization - the smallest grantable privilege
    # Examples: "read", "write", "delete", "manage_users", "view_reports", "export_data"
    # 
    # Permission Hierarchy:
    # 1. Permission: The atomic action (e.g., permission:write)
    # 2. Access: Defines permissions (e.g., access:write_access defines permission:write)
    # 3. Role: Modifies permissions on access (e.g., role:developer modifies permission:write on access:write_access)
    # 4. Project: Has access objects assigned (e.g., project:project1 has access:write_access)
    # 5. User: Assigned to roles (e.g., user:bob is assignee of role:developer)
    # 
    # Result: user:bob -> role:developer -> modifies permission:write -> access:write_access -> project:project1
    # This allows checking: "Can user:bob perform permission:write on project:project1?"
    # 
    # No relations needed - permissions are identified by their type name
    # They are referenced through access objects and roles, not directly assigned to users

  # Condition: Check if an access grant is still valid (not expired)
  # This condition is used to enforce time-based access control
  # Parameters:
  #   - current_time: The current timestamp (typically provided by the system)
  #   - expiration_time: The timestamp when the grant expires (stored in tuple context)
  # Returns: true if current_time < expiration_time (grant is still valid)
  # 
  # Usage: Applied to role assignee relations to ensure expired role assignments are invalid
  # Example: When checking if user:bob is assignee of role:developer, this condition
  # verifies that the assignment hasn't expired based on the expiration_time in the tuple context
  condition not_expired_grants(current_time: timestamp, expiration_time: timestamp) {
    current_time < expiration_time
  }






tuples:
  # Example: Create a parent project (organization level) and assign owner
  - object: project:organization
    user: user:alice
    relation: owner
  
  # Example: Create a child project (department level) with parent relationship
  - object: project:project1
    user: project:organization
    relation: parent
  
  # Example: Create another child project
  - object: project:project2
    user: project:organization
    relation: parent
  
  # Example: Create access objects and define their permissions
  # This creates access:write_access and defines that it includes permission:write
  - object: access:write_access
    user: permission:write
    relation: defines_permission
  
  # Example: Create access object for read permissions
  - object: access:read_access
    user: permission:read
    relation: defines_permission
  
  # Example: Assign access to project
  # Project:project1 now has access:write_access available
  - object: project:project1
    user: access:write_access
    relation: has_access
  
  # Example: Assign access to project
  - object: project:project1
    user: access:read_access
    relation: has_access
  
  # Example: Create roles and assign them to modify permissions on access
  # Developer role can modify write permission on write_access
  - object: role:developer
    user: permission:write
    relation: modifies_permission
  
  # Developer role can also modify read permission
  - object: role:developer
    user: permission:read
    relation: modifies_permission
  
  # Developer role can edit (assign role to itself to grant the permission)
  - object: role:developer
    user: role:developer
    relation: can_edit
  
  # Viewer role can only modify read permission
  - object: role:viewer
    user: permission:read
    relation: modifies_permission
  
  # Example: Assign roles to access objects
  # access:write_access now has role:developer assigned to it
  - object: access:write_access
    user: role:developer
    relation: has_role
  
  # access:read_access has both developer and viewer roles
  - object: access:read_access
    user: role:developer
    relation: has_role
  
  - object: access:read_access
    user: role:viewer
    relation: has_role
  
  # Example: Assign roles to project (required when access is assigned)
  # Since project:project1 has access:write_access which has role:developer,
  # we must also assign role:developer to project:project1
  - object: project:project1
    user: role:developer
    relation: project_role
  
  # Since project:project1 has access:read_access which has role:developer and role:viewer,
  # we must also assign these roles to project:project1 (developer already assigned above)
  - object: project:project1
    user: role:viewer
    relation: project_role
  
  # Example: Assign user to role (permanent assignment, no expiration)
  - object: role:developer
    user: user:bob
    relation: assignee
  
  # Example: Assign user to a role that's not assigned to any access on project1 (for testing unassigned access)
  - object: role:viewer
    user: user:charlie
    relation: assignee
  
  # Example: Create a manager role with delegation permission
  - object: role:manager
    user: role:manager
    relation: can_delegate
  
  # Manager role can modify write permission
  - object: role:manager
    user: permission:write
    relation: modifies_permission
  
  # Example: Assign manager role to access
  - object: access:write_access
    user: role:manager
    relation: has_role
  
  # Example: Assign manager role to project (required when access is assigned)
  # Since project:project1 has access:write_access which has role:manager,
  # we must also assign role:manager to project:project1
  - object: project:project1
    user: role:manager
    relation: project_role
  
  # Example: Assign user to manager role (with delegation capability)
  - object: role:manager
    user: user:dave
    relation: assignee

tests:
  - name: Owner has full access to parent project
    check:
      - user: user:alice
        object: project:organization
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
          can_manage_users: true
  
  - name: Owner inherits access to child projects
    check:
      - user: user:alice
        object: project:project1
        assertions:
          can_view: true
          can_edit: true
          can_delete: true
          can_manage_users: true
  
  - name: User with role has access
    check:
      - user: user:bob
        object: project:project1
        assertions:
          can_view: true
          can_edit: false  # Only admins can edit, not regular users with roles
          can_manage_users: false
  
  - name: Unassigned user has no access
    check:
      - user: user:charlie
        object: project:project1
        assertions:
          can_view: false
          can_edit: false
  
  - name: Hierarchy inheritance test
    check:
      - user: user:alice
        object: project:project2
        assertions:
          can_view: true
          can_delete: true
  
  - name: Delegation permission test
    check:
      # Check if role:manager has can_delegate permission (role assigned to itself)
      - user: role:manager
        object: role:manager
        assertions:
          can_delegate: true
      # Check if user:dave can delegate through their role assignment
      - user: user:dave
        object: role:manager
        assertions:
          users_who_can_delegate: true
  
  - name: Non-expired grant condition test
    check:
      - user: user:bob
        object: role:developer
        assertions:
          assignee: true
